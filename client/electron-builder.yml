appId: com.moltty.app
productName: Moltty
directories:
  buildResources: resources
  output: release
extraResources:
  # Arch-specific cloudflared (run `npm run fetch-cloudflared` first); notarized with the app.
  - from: resources/bin/cloudflared-darwin-${arch}
    to: bin/cloudflared
mac:
  target: dmg
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  notarize: true
  protocols:
    - name: Moltty Auth
      schemes:
        - moltty
    - name: Remoterm Auth
      schemes:
        - remoterm
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
