version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies
    dir: client
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json

  dev:
    desc: Start dev server
    deps: [install]
    dir: client
    cmds:
      - npm run dev

  build:
    desc: Build the app
    deps: [install]
    dir: client
    cmds:
      - npm run build

  test:
    desc: Run Playwright tests
    deps: [install]
    dir: client
    cmds:
      - npx playwright test

  test-unit:
    desc: Run Vitest unit/integration tests (client main process + packages/protocol)
    deps: [install]
    cmds:
      - cd client && npm run test:unit
      - cd packages/protocol && npm install && npm test

  package:
    desc: Package the app for distribution
    deps: [build]
    dir: client
    env:
      APPLE_API_KEY_ID: 2ZR5277S92
      APPLE_API_ISSUER: afb89f06-eb3e-4054-a8a4-fc134c6ae859
      APPLE_API_KEY: "{{.HOME}}/private_keys/AuthKey_2ZR5277S92.p8"
      APPLE_TEAM_ID: 8BKF8DY7Y4
    cmds:
      - bash scripts/fetch-cloudflared.sh
      - npm run package

  bump:
    desc: Bump minor version in package.json
    dir: client
    cmds:
      - npm version minor --no-git-tag-version
    silent: true

  release:
    desc: Bump version, commit, push, build, package, and create GitHub release
    cmds:
      - task: bump
      - |
        VERSION=$(node -p "require('./client/package.json').version")
        git add -A
        git commit -m "v${VERSION}: release"
        git push
      - task: package
      - |
        VERSION=$(node -p "require('./client/package.json').version")
        gh release create "v${VERSION}" --title "Remoterm v${VERSION}" --generate-notes "client/release/Remoterm-${VERSION}-arm64.dmg"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf client/dist client/out client/release
